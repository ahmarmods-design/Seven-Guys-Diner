kind = "web"
previewPath = "/"
title = "Seven Guys Pizza & Burger"
version = "1.0.0"
id = "artifacts/seven-guys"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20624

[services.development]
run = "pnpm --filter @workspace/seven-guys run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/seven-guys", "run", "build" ]
serve = "static"
publicDir = "artifacts/seven-guys/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20624"
BASE_PATH = "/"
